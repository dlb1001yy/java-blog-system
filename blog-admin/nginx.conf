server {
    listen       80;
    server_name  _;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # /api 反向代理到后端容器
    location /api {
        # Docker 内置 DNS，让 nginx 按需重新解析 blog-backend，避免容器重建后 IP 变化导致 502
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://blog-backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # MinIO 对象存储反代（封面图等上传文件的浏览器访问，/uploads/<key> → minio <bucket>/<key>）
    # 说明：proxy_pass 不含变量时会自动做 location 前缀替换（/uploads/ → /blog/），
    # 无需 resolver/rewrite；容器名在 nginx 启动时解析一次（minio 容器重建后需重启 nginx 容器）
    location /uploads/ {
        proxy_pass http://minio:9000/blog/;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    # 管理后台静态资源（vite base 为 /admin/，Dockerfile 将 dist 复制到 html/admin/）
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 默认重定向到 /admin/
    location = / {
        return 301 /admin/;
    }

    # favicon 静默处理（避免 404 噪音日志）
    location = /favicon.ico {
        alias /usr/share/nginx/html/admin/favicon.svg;
        access_log off;
        log_not_found off;
    }
    location = /admin/favicon.ico {
        alias /usr/share/nginx/html/admin/favicon.svg;
        access_log off;
        log_not_found off;
    }
}
