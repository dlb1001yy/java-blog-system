# Docker 环境配置（通过 --spring.profiles.active=docker 激活）
# 覆盖 application.yaml 中的数据库、Redis 与文件上传路径配置

# 日志文件路径（logback RollingFileAppender 使用，docker-compose 挂载卷持久化）
logging:
  file:
    name: /app/logs/blog-backend.log
    error-name: /app/logs/blog-backend-error.log

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    # 使用容器名 mysql 作为主机，数据库名与默认配置一致
    # 账号密码通过 MYSQL_USERNAME / MYSQL_PASSWORD 环境变量注入（docker-compose environment 或宿主机环境）
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:dlbyy_zp_blog}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 使用容器名 redis 作为主机
      host: redis
      port: 6379
      database: 5
      # Redis 密码通过 REDIS_PASSWORD 环境变量注入（docker-compose environment 或宿主机环境）
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms
    elasticsearch:
      repositories:
        enabled: false  # 禁用自动配置，由 ElasticsearchConfig 按条件显式开启
  elasticsearch:
    # 使用容器名 elasticsearch 作为主机
    uris: http://elasticsearch:9200
    connection-timeout: 5s
    socket-timeout: 30s
  # 生产环境关闭 SpringDoc / Knife4j 文档端点（配合 swagger.enabled=false 双重关闭）
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false

# Actuator 监控端点：生产环境仅暴露必要端点，显式关闭敏感端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
        exclude: env,beans,configprops  # 生产环境关闭敏感端点

# 文件上传路径（Linux 容器内路径，通过数据卷持久化）
file:
  upload-path: /app/uploads/
  allowed-types: jpg,jpeg,png,gif,webp,md,markdown
  max-size: 10485760  # 10MB

# 文件存储策略（Docker 环境默认使用本地存储，可通过 STORAGE_TYPE=minio 切换为 MinIO）
storage:
  type: ${STORAGE_TYPE:local}  # local | minio | oss
  local:
    upload-path: /app/uploads/
    url-prefix: /uploads/
    allowed-types: jpg,jpeg,png,gif,webp,md,markdown
    max-size: 10485760
  minio:
    # MinIO 五项配置通过同名环境变量注入（STORAGE_TYPE=minio 时生效），以下为 Docker 环境默认值
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}  # 容器内网地址
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:blog}
    url-prefix: ${MINIO_URL_PREFIX:http://localhost:9000/blog/}
  oss:
    # 阿里云 OSS 五项配置通过环境变量注入（STORAGE_TYPE=oss 时生效），无默认值需显式配置
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    url-prefix: ${OSS_URL_PREFIX:}

# 网站配置
blog:
  name: "Java码农笔记"
  description: "记录Java学习之路，分享技术心得"
  domain: "http://localhost:8080"
  # Elasticsearch 开关：通过环境变量 BLOG_SEARCH_ENABLED 控制
  search:
    enabled: ${BLOG_SEARCH_ENABLED:false}
