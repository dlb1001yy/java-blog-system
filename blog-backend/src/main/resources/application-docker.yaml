# Docker 环境配置（通过 --spring.profiles.active=docker 激活）
# 覆盖 application.yaml 中的数据库、Redis 与文件上传路径配置
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    # 使用容器名 mysql 作为主机，数据库名与默认配置一致
    url: jdbc:mysql://mysql:3306/dlbyy_zp_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 使用容器名 redis 作为主机
      host: redis
      port: 6379
      database: 5
      password: 123456
      timeout: 3000ms

# 文件上传路径（Linux 容器内路径，通过数据卷持久化）
file:
  upload-path: /app/uploads/
  allowed-types: jpg,jpeg,png,gif,webp,md,markdown
  max-size: 10485760  # 10MB

# 网站配置
blog:
  name: "Java码农笔记"
  description: "记录Java学习之路，分享技术心得"
  domain: "http://localhost:8080"
