# 敏感配置统一走环境变量（${VAR:默认}），冒号后为本地开发默认值，生产环境通过环境变量注入真实值
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: blog-backend
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:dlbyy_zp_blog}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # 数据库账号密码通过 MYSQL_USERNAME / MYSQL_PASSWORD 环境变量覆盖
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
      # Redis 密码通过 REDIS_PASSWORD 环境变量覆盖
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms
    elasticsearch:
      repositories:
        enabled: false  # 禁用自动配置，由 ElasticsearchConfig 按条件显式开启
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志统一走 SLF4J 管道（配合 logback 轮转），需要排查 SQL 时设置 logging.level.com.dlbyy.blog.mapper=DEBUG
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 自动填充配置说明：
      # 自动填充通过 CustomMetaObjectHandler Bean 实现（见 config/CustomMetaObjectHandler.java）
      # 实体字段需标注 @TableField(fill = FieldFill.INSERT) 或 @TableField(fill = FieldFill.INSERT_UPDATE)

# 监控指标（Actuator）：端点经 context-path 暴露为 /api/actuator/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # 仅暴露必要端点，不暴露 env/beans 等敏感端点
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}  # 所有指标带 application 标签，便于 Prometheus 识别

jwt:
  # 确保密钥长度至少为 64 个字符（满足 HS512 算法 512 位的要求）
  # 生产环境必须通过 JWT_SECRET 环境变量注入强随机值，勿用默认值
  secret: ${JWT_SECRET:ThisIsASecureSecretKeyForJwtTokenGenerationAndValidationMakeItLongEnough123}
  header: Authorization
  prefix: "Bearer "

# 安全认证增强配置（限流 / 账户锁定 / 密码加密 / Cookie）
# 可动态调整无需改代码
security:
  login:
    ip-limit-count: 5          # 单个 IP 每分钟最多登录尝试次数
    ip-window-seconds: 60      # IP 限流窗口（秒）
    user-fail-threshold: 5     # 同一用户名连续失败达到该次数锁定账户
    lock-minutes: 15           # 账户锁定时长（分钟）
    captcha-enabled: true      # 是否开启登录图形验证码校验
    alert-enabled: true        # 达到锁定阈值是否触发告警通知
    bcrypt-strength: 12        # BCrypt 加密强度（盐值轮数）
    access-token-minutes: 15   # 访问令牌有效期（分钟）
    refresh-token-days: 7      # 刷新令牌有效期（天）
    cookie-secure: true        # refresh Cookie 是否带 Secure（本地 HTTP 联调置 false）
    cookie-same-site: "None"    # refresh Cookie SameSite 策略
  signing:
    enabled: true                # 是否开启请求签名验证（false 时完全跳过，行为与之前一致）
    secret: ${API_SIGNING_SECRET:BlogApiSigningSecret2024!}  # 签名密钥，生产环境必须通过环境变量注入强随机值，勿用默认值
    timestamp-window-seconds: 60 # 请求时间戳有效窗口（秒），超过则拒绝
  cors:
    # 允许携带凭证的跨域来源（逗号分隔）；生产必须改为精确域名，如 https://yourdomain.com,https://admin.yourdomain.com
    # 默认 * 仅用于本地开发
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# 文件上传路径（旧版 FileUtils 使用，保持向后兼容）
file:
  upload-path: D:\\my-project\\java-blog-system\\blog-backend\\uploads\\
  allowed-types: jpg,jpeg,png,gif,webp,md,markdown
  max-size: 10485760  # 10MB

# 文件存储策略配置（策略模式，通过 storage.type 切换）
storage:
  type: ${STORAGE_TYPE:local}  # local | minio | oss
  local:
    upload-path: D:\\my-project\\java-blog-system\\blog-backend\\uploads\\
    # 带 /api 前缀：前端代理（vite/nginx）仅转发 /api，与 WebMvcConfig 静态映射（context-path 下）对齐
    url-prefix: /api/uploads/
    allowed-types: jpg,jpeg,png,gif,webp,md,markdown
    max-size: 10485760  # 10MB
  minio:
    # MinIO 五项配置通过同名环境变量注入（STORAGE_TYPE=minio 时生效），以下为本地开发默认值
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:blog}
    url-prefix: ${MINIO_URL_PREFIX:/uploads/}
  oss:
    # 阿里云 OSS 五项配置通过环境变量注入（STORAGE_TYPE=oss 时生效），无默认值需显式配置
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    url-prefix: ${OSS_URL_PREFIX:}

# API 文档开关：本地开发默认开启，Docker 生产通过 SWAGGER_ENABLED 环境变量默认关闭
swagger:
  enabled: ${SWAGGER_ENABLED:true}

# 网站配置
blog:
  name: "Java码农笔记"
  description: "记录Java学习之路，分享技术心得"
  domain: "http://localhost:8080"
  # Elasticsearch 开关：false=不启用ES（本地/低内存），true=启用ES全文检索
  # Docker 环境通过 BLOG_SEARCH_ENABLED 环境变量覆盖
  search:
    enabled: false