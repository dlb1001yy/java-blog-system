server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dlbyy_zp_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
      password: 123456
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 确保密钥长度至少为 64 个字符（满足 HS512 算法 512 位的要求）
  secret: ThisIsASecureSecretKeyForJwtTokenGenerationAndValidationMakeItLongEnough123
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: "Bearer "

# 文件上传路径
file:
  upload-path: D:\\my-project\\java-blog-system\\blog-backend\\uploads\\
  allowed-types: jpg,jpeg,png,gif,webp,md,markdown
  max-size: 10485760  # 10MB

# 网站配置
blog:
  name: "Java码农笔记"
  description: "记录Java学习之路，分享技术心得"
  domain: "http://localhost:8080"