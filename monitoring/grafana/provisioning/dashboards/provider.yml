# Grafana 仪表盘自动预配：从容器 /var/lib/grafana/dashboards 加载 JSON
apiVersion: 1
providers:
  - name: blog-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
