# Java 博客系统 Docker Compose 编排
# 使用：docker compose up -d --build
# 敏感配置（数据库/Redis 密码、JWT 与 API 签名密钥等）支持通过项目根目录 .env 覆盖：
#   将 .env.example 复制为 .env 后按需修改（.env 不入 git）；
#   未设置时使用下方 ${VAR:-默认值} 中的默认值。
# 前台门户：http://<服务器IP>:8082
# 管理后台：http://<服务器IP>:8081/admin/
# 后端 API：http://<服务器IP>:8080/api
# 接口文档：http://<服务器IP>:8080/api/doc.html
# 监控（可选）：http://<服务器IP>:3000 （Grafana，启用方式见 README「监控体系」）

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: dlbyy_zp_blog
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载整个 sql 目录：该目录下的 .sql 仅在【首次建库（数据目录为空）】时按文件名顺序执行一次。
      # 已有旧库的表结构变更（如新增字段）由后端 DataInitializer 在每次启动时幂等补全，
      # 不会因 docker compose 重新部署而丢失更新。
      - ./blog-backend/sql:/docker-entrypoint-initdb.d/:ro
    networks:
      - blog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== Elasticsearch 全文检索（可选，通过 .env 中 COMPOSE_PROFILES 控制） ==========
  elasticsearch:
    profiles: ["search"]
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: blog-elasticsearch:8.11.1-ik
    container_name: blog-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - blog-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ========== 后端服务 ==========
  blog-backend:
    build:
      context: ./blog-backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BLOG_SEARCH_ENABLED: ${BLOG_SEARCH_ENABLED:-false}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-ThisIsASecureSecretKeyForJwtTokenGenerationAndValidationMakeItLongEnough123}
      API_SIGNING_SECRET: ${API_SIGNING_SECRET:-BlogApiSigningSecret2024!}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # 上传文件持久化
      - uploads_data:/app/uploads
    networks:
      - blog-net
    healthcheck:
      # eclipse-temurin JRE 镜像无 curl，使用 bash /dev/tcp 检测端口连通性
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ========== 管理后台 ==========
  blog-admin:
    build:
      context: ./blog-admin
      dockerfile: Dockerfile
    container_name: blog-admin
    restart: unless-stopped
    depends_on:
      blog-backend:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - blog-net

  # ========== 前台门户 ==========
  blog-frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    depends_on:
      blog-backend:
        condition: service_healthy
    ports:
      - "8082:80"
    networks:
      - blog-net

  # ========== Prometheus 指标采集（可选，通过 .env 中 COMPOSE_PROFILES 包含 monitor 启用） ==========
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: blog-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - blog-net
    profiles: ["monitor"]

  # ========== Grafana 可视化（可选，与 Prometheus 同组启用） ==========
  grafana:
    image: grafana/grafana:10.4.2
    container_name: blog-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - blog-net
    profiles: ["monitor"]

# ========== 数据卷 ==========
volumes:
  mysql_data:
    name: blog_mysql_data
  redis_data:
    name: blog_redis_data
  uploads_data:
    name: blog_uploads_data
  es_data:
    name: blog_es_data
  prometheus_data:
    name: blog_prometheus_data
  grafana_data:
    name: blog_grafana_data

# ========== 网络 ==========
networks:
  blog-net:
    name: blog-net
    driver: bridge
